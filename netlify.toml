[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8889
  framework = "vite"

# Single Page Application (SPA) redirect rule:
# Route all direct URLs, product pages, and deep links to /index.html with status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimize static asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
